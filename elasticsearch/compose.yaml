services:
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
    container_name: cerebro-seed-es01
    environment:
    - node.name=es01
    - cluster.name=${LAB_CLUSTER_NAME:-cerebro-shard-lab}
    - discovery.seed_hosts=es01,es02,es03,es04,es05
    - cluster.initial_master_nodes=es01,es02,es03
    - node.attr.zone=zone-a
    - xpack.security.enabled=false
    - xpack.ml.enabled=false
    - ES_JAVA_OPTS=-Xms${ES_HEAP:-640m} -Xmx${ES_HEAP:-640m}
    - node.roles=master,data,ingest
    - node.processors=2
    - ingest.geoip.downloader.enabled=false
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
    - es01-data:/usr/share/elasticsearch/data
    ports:
    - ${ES_BIND_IP:-127.0.0.1}:${ES_PORT:-9200}:9200
    networks:
    - es-lab
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS --max-time 5 http://localhost:9200/_cluster/health >/dev/null
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 40s
  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
    container_name: cerebro-seed-es02
    environment:
    - node.name=es02
    - cluster.name=${LAB_CLUSTER_NAME:-cerebro-shard-lab}
    - discovery.seed_hosts=es01,es02,es03,es04,es05
    - cluster.initial_master_nodes=es01,es02,es03
    - node.attr.zone=zone-b
    - xpack.security.enabled=false
    - xpack.ml.enabled=false
    - ES_JAVA_OPTS=-Xms${ES_HEAP:-640m} -Xmx${ES_HEAP:-640m}
    - node.roles=master,data,ingest
    - node.processors=2
    - ingest.geoip.downloader.enabled=false
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
    - es02-data:/usr/share/elasticsearch/data
    networks:
    - es-lab
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS --max-time 5 http://localhost:9200/_cluster/health >/dev/null
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 40s
  es03:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
    container_name: cerebro-seed-es03
    environment:
    - node.name=es03
    - cluster.name=${LAB_CLUSTER_NAME:-cerebro-shard-lab}
    - discovery.seed_hosts=es01,es02,es03,es04,es05
    - cluster.initial_master_nodes=es01,es02,es03
    - node.attr.zone=zone-c
    - xpack.security.enabled=false
    - xpack.ml.enabled=false
    - ES_JAVA_OPTS=-Xms${ES_HEAP:-640m} -Xmx${ES_HEAP:-640m}
    - node.roles=master,data,ingest
    - node.processors=2
    - ingest.geoip.downloader.enabled=false
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
    - es03-data:/usr/share/elasticsearch/data
    networks:
    - es-lab
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS --max-time 5 http://localhost:9200/_cluster/health >/dev/null
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 40s
  es04:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
    container_name: cerebro-seed-es04
    environment:
    - node.name=es04
    - cluster.name=${LAB_CLUSTER_NAME:-cerebro-shard-lab}
    - discovery.seed_hosts=es01,es02,es03,es04,es05
    - cluster.initial_master_nodes=es01,es02,es03
    - node.attr.zone=zone-a
    - xpack.security.enabled=false
    - xpack.ml.enabled=false
    - ES_JAVA_OPTS=-Xms${ES_HEAP:-640m} -Xmx${ES_HEAP:-640m}
    - node.roles=master,data,ingest
    - node.processors=2
    - ingest.geoip.downloader.enabled=false
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
    - es04-data:/usr/share/elasticsearch/data
    networks:
    - es-lab
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS --max-time 5 http://localhost:9200/_cluster/health >/dev/null
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 40s
  es05:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
    container_name: cerebro-seed-es05
    environment:
    - node.name=es05
    - cluster.name=${LAB_CLUSTER_NAME:-cerebro-shard-lab}
    - discovery.seed_hosts=es01,es02,es03,es04,es05
    - cluster.initial_master_nodes=es01,es02,es03
    - node.attr.zone=zone-b
    - xpack.security.enabled=false
    - xpack.ml.enabled=false
    - ES_JAVA_OPTS=-Xms${ES_HEAP:-640m} -Xmx${ES_HEAP:-640m}
    - node.roles=master,data,ingest
    - node.processors=2
    - ingest.geoip.downloader.enabled=false
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
    - es05-data:/usr/share/elasticsearch/data
    networks:
    - es-lab
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS --max-time 5 http://localhost:9200/_cluster/health >/dev/null
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 40s
  cerebro:
    image: docker.io/lmenezes/cerebro:0.9.4
    container_name: cerebro-seed-cerebro
    depends_on:
    - es01
    - es02
    - es03
    - es04
    - es05
    ports:
    - ${ES_BIND_IP:-127.0.0.1}:${CEREBRO_PORT:-9000}:9000
    volumes:
    - ./cerebro/application.conf:/opt/cerebro/conf/application.conf:ro,Z
    networks:
    - es-lab
    environment:
    - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.29
    container_name: cerebro-seed-kibana
    depends_on:
    - es01
    - es02
    - es03
    - es04
    - es05
    ports:
    - ${ES_BIND_IP:-127.0.0.1}:${KIBANA_PORT:-5601}:5601
    networks:
    - es-lab
    environment:
    - SERVER_NAME=kibana
    - SERVER_HOST=0.0.0.0
    - ELASTICSEARCH_HOSTS=["http://es01:9200","http://es02:9200","http://es03:9200","http://es04:9200","http://es05:9200"]
    - XPACK_SECURITY_ENABLED=false
    - TELEMETRY_ENABLED=false
networks:
  es-lab:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
volumes:
  es01-data: null
  es02-data: null
  es03-data: null
  es04-data: null
  es05-data: null
