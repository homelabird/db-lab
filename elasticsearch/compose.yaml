  cerebro:
    image: docker.io/lmenezes/cerebro:0.9.4
    container_name: ${LAB_CONTAINER_PREFIX:-cerebro-seed-}cerebro
    depends_on:
    - es01
    - es02
    - es03
    - es04
    - es05
    ports:
    - ${ES_BIND_IP:-127.0.0.1}:${CEREBRO_PORT:-9000}:9000
    volumes:
    - ./cerebro/application.conf:/opt/cerebro/conf/application.conf:ro,Z
    networks:
    - es-lab
    environment:
    - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.29
    container_name: ${LAB_CONTAINER_PREFIX:-cerebro-seed-}kibana
    depends_on:
    - es01
    - es02
    - es03
    - es04
    - es05
    ports:
    - ${ES_BIND_IP:-127.0.0.1}:${KIBANA_PORT:-5601}:5601
    networks:
    - es-lab
    environment:
    - SERVER_NAME=kibana
    - SERVER_HOST=0.0.0.0
    - ELASTICSEARCH_HOSTS=["http://es01:9200","http://es02:9200","http://es03:9200","http://es04:9200","http://es05:9200"]
    - XPACK_SECURITY_ENABLED=${XPACK_SECURITY_ENABLED:-false}
    - XPACK_MONITORING_UI_ENABLED=${KIBANA_STACK_MONITORING_ENABLED:-true}
    - ELASTICSEARCH_USERNAME=${KIBANA_USERNAME:-kibana_system}
    - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:-}
    - TELEMETRY_ENABLED=false
networks:
  # Plain bridge only: no runtime-specific options, so both Docker Compose
  # and podman-compose can create this network (the Docker-only ICC bridge
  # option is rejected by podman-netavark, aborting podman-compose with exit 125).
  es-lab:
    driver: bridge
volumes:
  es-certs: null
  es01-data: null
  es02-data: null
  es03-data: null
  es04-data: null
  es05-data: null
  # One shared filesystem for the snapshot repository on every node.
  es-snapshots: null
