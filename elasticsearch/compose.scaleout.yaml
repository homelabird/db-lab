services:
  es06:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
    container_name: cerebro-seed-es06
    environment:
    - node.name=es06
    - cluster.name=${LAB_CLUSTER_NAME:-cerebro-shard-lab}
    - discovery.seed_hosts=es01,es02,es03,es04,es05
    - node.attr.zone=zone-c
    - xpack.security.enabled=${XPACK_SECURITY_ENABLED:-false}
    - path.repo=/usr/share/elasticsearch/snapshots
    - ELASTIC_USERNAME=${ELASTIC_USERNAME:-elastic}
    - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-}
    - xpack.ml.enabled=false
    - ES_JAVA_OPTS=-Xms${ES_HEAP:-512m} -Xmx${ES_HEAP:-512m}
    - node.roles=master,data,ingest
    - node.processors=2
    - ingest.geoip.downloader.enabled=false
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
    - es06-data:/usr/share/elasticsearch/data
    - es-snapshots:/usr/share/elasticsearch/snapshots
    networks:
    - es-lab
    entrypoint:
    - /bin/bash
    - -c
    - |
      mkdir -p /usr/share/elasticsearch/snapshots
      chown -R 1000:0 /usr/share/elasticsearch/snapshots
      exec /usr/local/bin/docker-entrypoint.sh "$@"
    - lab-bootstrap
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS --max-time 5 http://localhost:9200/_cluster/health >/dev/null
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 40s
volumes:
  es06-data: null
