# KRaft combined mode for the learning lab. Each node is both broker and controller.
services:
  kafka1:
    image: docker.io/confluentinc/cp-kafka:${CP_VERSION:-7.9.0}
    container_name: ${LAB_NAME:-kzk-lab}-kafka1
    hostname: kafka1
    restart: "no"
    labels:
      io.kzk.lab: ${LAB_NAME:-kzk-lab}
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9094,2@kafka2:9094,3@kafka3:9094"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094,EXTERNAL://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka1:9092,EXTERNAL://${ADVERTISED_HOST:-localhost}:${KAFKA1_PORT:-19092}"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "6"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: "3"
      KAFKA_NUM_PARTITIONS: "6"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "1000"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_AUTO_LEADER_REBALANCE_ENABLE: "false"
      KAFKA_REPLICA_LAG_TIME_MAX_MS: "10000"
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_LOG_SEGMENT_BYTES: "16777216"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "10000"
      KAFKA_LOG_CLEANER_ENABLE: "true"
      CLUSTER_ID: ${KRAFT_CLUSTER_ID:?KRAFT_CLUSTER_ID is required}
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms256m -Xmx512m}
    ports:
      - "${BIND_IP:-127.0.0.1}:${KAFKA1_PORT:-19092}:9093"
    volumes: [kraft-kafka1-data:/var/lib/kafka/data:U]
    networks: [labnet]
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  kafka2:
    extends: {service: kafka1}
    container_name: ${LAB_NAME:-kzk-lab}-kafka2
    hostname: kafka2
    environment:
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka2:9092,EXTERNAL://${ADVERTISED_HOST:-localhost}:${KAFKA2_PORT:-29092}"
    ports:
      - "${BIND_IP:-127.0.0.1}:${KAFKA2_PORT:-29092}:9093"
    volumes: [kraft-kafka2-data:/var/lib/kafka/data:U]

  kafka3:
    extends: {service: kafka1}
    container_name: ${LAB_NAME:-kzk-lab}-kafka3
    hostname: kafka3
    environment:
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka3:9092,EXTERNAL://${ADVERTISED_HOST:-localhost}:${KAFKA3_PORT:-39092}"
    ports:
      - "${BIND_IP:-127.0.0.1}:${KAFKA3_PORT:-39092}:9093"
    volumes: [kraft-kafka3-data:/var/lib/kafka/data:U]

  tools:
    image: localhost/${LAB_NAME:-kzk-lab}-tools:1.0
    build: {context: ./client, dockerfile: Containerfile}
    container_name: ${LAB_NAME:-kzk-lab}-tools
    restart: "no"
    labels:
      io.kzk.lab: ${LAB_NAME:-kzk-lab}
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
    networks: [labnet]

networks:
  labnet:
    name: ${LAB_NAME:-kzk-lab}-net
    driver: bridge
    labels:
      io.kzk.lab: ${LAB_NAME:-kzk-lab}

volumes:
  kraft-kafka1-data:
    name: ${LAB_NAME:-kzk-lab}-kraft-kafka1-data
    labels:
      io.kzk.lab: ${LAB_NAME:-kzk-lab}
  kraft-kafka2-data:
    name: ${LAB_NAME:-kzk-lab}-kraft-kafka2-data
    labels:
      io.kzk.lab: ${LAB_NAME:-kzk-lab}
  kraft-kafka3-data:
    name: ${LAB_NAME:-kzk-lab}-kraft-kafka3-data
    labels:
      io.kzk.lab: ${LAB_NAME:-kzk-lab}
