global
    log stdout format raw local0
    maxconn 512

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 3s
    timeout client 5m
    timeout server 5m
    timeout check 4s

resolvers container_dns
    parse-resolv-conf
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold nx 2s

# Preferred writer. It is a ROUTING POLICY, not a Galera leader election.
# With no 'allbackups', the first available backup is chosen.
listen writer
    bind *:3306
    option httpchk GET /ready
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 resolvers container_dns init-addr libc,none
    server galera1 galera1:3306 check port 9200
    server galera2 galera2:3306 check port 9200 backup
    server galera3 galera3:3306 check port 9200 backup
    server galera4 galera4:3306 check port 9200 backup
    server galera5 galera5:3306 check port 9200 backup

# CONNECTION-level balancing, not SQL query inspection or per-query read splitting.
# Use the readonly SQL user here to enforce SELECT-only access.
listen readers
    bind *:3307
    balance roundrobin
    option httpchk GET /ready
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 resolvers container_dns init-addr libc,none
    server galera1 galera1:3306 check port 9200
    server galera2 galera2:3306 check port 9200
    server galera3 galera3:3306 check port 9200
    server galera4 galera4:3306 check port 9200
    server galera5 galera5:3306 check port 9200

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 3s
    stats hide-version
