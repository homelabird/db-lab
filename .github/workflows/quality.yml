name: Source and controller quality
# No DB start, SSH targets, fault injection, secrets or pull_request_target.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared host-check dependencies
        run: python -m pip install -r scripts/requirements-checks.txt
      - name: Static and all six host suites (not live DB evidence)
        run: python scripts/quality.py offline --output .quality/ci-offline
      - name: Upload quality summary only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-python-${{ matrix.python }}
          path: |
            .quality/ci-offline/summary.json
            .quality/ci-offline/report.md
            .quality/ci-offline/junit.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  ansible-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual Ansible (no mock fallback)
        run: python -m pip install -r ansible/requirements.txt
      - name: Install sshd for loopback-only transport acceptance
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - name: Real local playbooks with harmless fixture (not SSH/DB)
        run: bash scripts/test-ansible.sh
      - name: Real SSH auth and module transfer to disposable loopback sshd (not remote host/DB)
        run: bash scripts/test-ansible-ssh.sh
  helm-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared manifest-check dependencies
        run: python -m pip install -r scripts/requirements-checks.txt
      - name: Install pinned real Helm with release checksum
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --retry 2 \
            https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz -o "$tmp/helm.tar.gz"
          echo '1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb  '"$tmp/helm.tar.gz" | sha256sum --check --strict
          tar -xzf "$tmp/helm.tar.gz" -C "$tmp" linux-amd64/helm
          install -m 0755 "$tmp/linux-amd64/helm" "$RUNNER_TEMP/helm"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Real Helm profiles, isolation, and rejected unsafe values (no cluster)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .quality/helm
          bash scripts/test-helm.sh 2>&1 | tee .quality/helm/real-helm.log
      - name: Upload actual Helm output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: real-helm-render
          path: .quality/helm/real-helm.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
