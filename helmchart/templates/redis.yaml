{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "db-lab.fullname" . }}-redis
  labels: {{- include "db-lab.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    component: redis
    {{- include "db-lab.selector" . | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "db-lab.fullname" . }}-redis
  labels: {{- include "db-lab.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "db-lab.fullname" . }}-redis
  podManagementPolicy: Parallel
  replicas: {{ .Values.redis.replicas }}
  selector:
    matchLabels:
      component: redis
      {{- include "db-lab.selector" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/redis-start.sh: {{ .Files.Get "scripts/redis-start.sh" | sha256sum | quote }}
        checksum/redis-ready.sh: {{ .Files.Get "scripts/redis-ready.sh" | sha256sum | quote }}
      labels:
        component: redis
        {{- include "db-lab.selector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- include "db-lab.placement" (dict "root" . "component" "redis") | nindent 6 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          ports:
            - name: redis
              containerPort: 6379
          command: ["/bin/sh", "/opt/db-lab/redis-start.sh"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret | quote }}
                  key: redis-password
            - name: REDIS_PREFIX
              value: "{{ include "db-lab.fullname" . }}-redis"
            - name: REDIS_SERVICE
              value: "{{ include "db-lab.dns" (dict "root" . "service" (printf "%s-redis" (include "db-lab.fullname" .))) }}"
            - name: SENTINEL_PREFIX
              value: "{{ include "db-lab.fullname" . }}-redis-sentinel"
            - name: SENTINEL_SERVICE
              value: "{{ include "db-lab.dns" (dict "root" . "service" (printf "%s-redis-sentinel" (include "db-lab.fullname" .))) }}"
          startupProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command: ["/bin/sh", "/opt/db-lab/redis-ready.sh"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "export REDISCLI_AUTH=\"$REDIS_PASSWORD\"; test \"$(redis-cli --raw ping)\" = PONG"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scripts
              mountPath: /opt/db-lab
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: {{ include "db-lab.fullname" . }}-scripts
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "db-lab.selector" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "db-lab.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "db-lab.fullname" . }}-redis
spec:
  minAvailable: 2
  selector:
    matchLabels:
      component: redis
      {{- include "db-lab.selector" . | nindent 6 }}
{{- end }}
