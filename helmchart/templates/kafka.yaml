{{- if .Values.kafka.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "db-lab.fullname" . }}-kafka
  labels: {{- include "db-lab.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    component: kafka
    {{- include "db-lab.selector" . | nindent 4 }}
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "db-lab.fullname" . }}-kafka
  labels: {{- include "db-lab.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "db-lab.fullname" . }}-kafka
  podManagementPolicy: Parallel
  replicas: {{ .Values.kafka.replicas }}
  selector:
    matchLabels:
      component: kafka
      {{- include "db-lab.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        component: kafka
        {{- include "db-lab.selector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- include "db-lab.placement" (dict "root" . "component" "kafka") | nindent 6 }}
      containers:
        - name: kafka
          image: {{ .Values.kafka.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources: {{- toYaml .Values.kafka.resources | nindent 12 }}
          ports:
            - name: kafka
              containerPort: 9092
          command: ["/bin/bash", "-ec"]
          args:
            - export KAFKA_BROKER_ID="${HOSTNAME##*-}"; exec /etc/confluent/docker/run
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "{{ include "db-lab.fullname" . }}-zookeeper-0.{{ include "db-lab.dns" (dict "root" . "service" (printf "%s-zookeeper" (include "db-lab.fullname" .))) }}:2181,{{ include "db-lab.fullname" . }}-zookeeper-1.{{ include "db-lab.dns" (dict "root" . "service" (printf "%s-zookeeper" (include "db-lab.fullname" .))) }}:2181,{{ include "db-lab.fullname" . }}-zookeeper-2.{{ include "db-lab.dns" (dict "root" . "service" (printf "%s-zookeeper" (include "db-lab.fullname" .))) }}:2181"
            - name: KAFKA_LISTENERS
              value: "INTERNAL://0.0.0.0:9092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://$(POD_NAME).{{ include "db-lab.dns" (dict "root" . "service" (printf "%s-kafka" (include "db-lab.fullname" .))) }}:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE
              value: "false"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_HEAP_OPTS
              value: "{{ .Values.kafka.heap }}"
          startupProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command: ["/bin/bash", "-ec", "kafka-broker-api-versions --bootstrap-server 127.0.0.1:9092 >/dev/null"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "db-lab.selector" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "db-lab.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "db-lab.fullname" . }}-kafka
spec:
  minAvailable: 2
  selector:
    matchLabels:
      component: kafka
      {{- include "db-lab.selector" . | nindent 6 }}
{{- end }}
