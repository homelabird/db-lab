{{- if .Values.mariadb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "db-lab.fullname" . }}-mariadb
  labels: {{- include "db-lab.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    component: mariadb
    {{- include "db-lab.selector" . | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "db-lab.fullname" . }}-mariadb-peer
  labels: {{- include "db-lab.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    component: mariadb
    {{- include "db-lab.selector" . | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
    - name: galera
      port: 4567
      targetPort: galera
    - name: ist
      port: 4568
      targetPort: ist
    - name: sst
      port: 4444
      targetPort: sst
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "db-lab.fullname" . }}-mariadb
  labels: {{- include "db-lab.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "db-lab.fullname" . }}-mariadb-peer
  podManagementPolicy: Parallel
  replicas: {{ .Values.mariadb.replicas }}
  selector:
    matchLabels:
      component: mariadb
      {{- include "db-lab.selector" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/mariadb-start.sh: {{ .Files.Get "scripts/mariadb-start.sh" | sha256sum | quote }}
        checksum/mariadb-peer-ready.sh: {{ .Files.Get "scripts/mariadb-peer-ready.sh" | sha256sum | quote }}
        checksum/mariadb-ready.sh: {{ .Files.Get "scripts/mariadb-ready.sh" | sha256sum | quote }}
      labels:
        component: mariadb
        {{- include "db-lab.selector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1001
        runAsUser: 1001
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- include "db-lab.placement" (dict "root" . "component" "mariadb") | nindent 6 }}
      initContainers:
        - name: wait-for-galera-bootstrap-peer
          image: {{ .Values.mariadb.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/opt/db-lab/mariadb-peer-ready.sh"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GALERA_BOOTSTRAP_HOST
              value: "{{ include "db-lab.fullname" . }}-mariadb-{{ ternary .Values.mariadb.recovery.bootstrapOrdinal 0 (ge (int .Values.mariadb.recovery.bootstrapOrdinal) 0) }}.{{ include "db-lab.dns" (dict "root" . "service" (printf "%s-mariadb-peer" (include "db-lab.fullname" .))) }}"
            - name: BOOTSTRAP_NEW_CLUSTER
              value: "{{ ternary "yes" "no" .Values.mariadb.bootstrapNewCluster }}"
            - name: RECOVERY_ORDINAL
              value: "{{ .Values.mariadb.recovery.bootstrapOrdinal }}"
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mariadb.existingSecret | quote }}
                  key: mariadb-root-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /opt/db-lab
              readOnly: true
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources: {{- toYaml .Values.mariadb.resources | nindent 12 }}
          ports:
            - name: mysql
              containerPort: 3306
            - name: galera
              containerPort: 4567
            - name: ist
              containerPort: 4568
            - name: sst
              containerPort: 4444
          command: ["/bin/bash", "/opt/db-lab/mariadb-start.sh"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mariadb.existingSecret | quote }}
                  key: mariadb-root-password
            - name: MARIADB_GALERA_MARIABACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mariadb.existingSecret | quote }}
                  key: mariadb-sst-password
            - name: MARIADB_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mariadb.existingSecret | quote }}
                  key: mariadb-sst-password
            - name: MARIADB_GALERA_MARIABACKUP_USER
              value: "mariabackup"
            - name: MARIADB_GALERA_CLUSTER_NAME
              value: "{{ include "db-lab.fullname" . }}-mariadb"
            - name: EXPECTED_CLUSTER_SIZE
              value: {{ .Values.mariadb.replicas | quote }}
            - name: GALERA_PEERS
              value: "{{ include "db-lab.fullname" . }}-mariadb-0.{{ include "db-lab.dns" (dict "root" . "service" (printf "%s-mariadb-peer" (include "db-lab.fullname" .))) }},{{ include "db-lab.fullname" . }}-mariadb-1.{{ include "db-lab.dns" (dict "root" . "service" (printf "%s-mariadb-peer" (include "db-lab.fullname" .))) }},{{ include "db-lab.fullname" . }}-mariadb-2.{{ include "db-lab.dns" (dict "root" . "service" (printf "%s-mariadb-peer" (include "db-lab.fullname" .))) }}"
            - name: BOOTSTRAP_NEW_CLUSTER
              value: "{{ ternary "yes" "no" .Values.mariadb.bootstrapNewCluster }}"
            - name: RECOVERY_ORDINAL
              value: "{{ .Values.mariadb.recovery.bootstrapOrdinal }}"
          startupProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command: ["/bin/bash", "/opt/db-lab/mariadb-ready.sh"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /bitnami/mariadb
            - name: scripts
              mountPath: /opt/db-lab
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: {{ include "db-lab.fullname" . }}-scripts
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "db-lab.selector" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "db-lab.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.mariadb.storage }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "db-lab.fullname" . }}-mariadb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      component: mariadb
      {{- include "db-lab.selector" . | nindent 6 }}
{{- end }}
